<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HW3 Resilient Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="hero">

            <h1>Coming Soon</h1>

            <p>
                Our new production experience is launching soon.
            </p>

            <!-- Slice 1: Countdown -->
            <div
                id="countdown"
                aria-live="polite"
                aria-label="Countdown timer"
            >
                Loading...
            </div>

            <!-- Slice 2: State-Machine Form -->
            <form id="signup-form">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <button
                    id="submit-button"
                    type="submit"
                >
                    Notify Me
                </button>

                <p
                    id="form-status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
