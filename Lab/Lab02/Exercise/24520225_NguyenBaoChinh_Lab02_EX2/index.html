<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2 - Reactive Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #202938;
        }

        main {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000012;
        }

        h1 {
            margin-top: 0;
        }

        .controls,
        .filters {
            display: flex;
            gap: 10px;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        input,
        button {
            font: inherit;
            padding: 10px 12px;
            border-radius: 6px;
        }

        input {
            flex: 1;
            min-width: 150px;
            border: 1px solid #cbd5e1;
        }

        button {
            border: 0;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button.active {
            background: #0f766e;
        }

        button.delete {
            background: #dc2626;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .task span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #64748b;
        }

        .empty {
            color: #64748b;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
</body>

</html>
